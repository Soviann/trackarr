services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: plextracker-dev
    ports:
      - "5173:5173"   # Vite dev server (http://plextracker.local:5173)
      - "8080:8080"   # Go backend (API, proxied by Vite)
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - node-modules:/app/frontend/node_modules
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - DATA_DIR=/app/data
    working_dir: /app

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
