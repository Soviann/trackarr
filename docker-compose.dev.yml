services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: plextracker-wt-af048674
    ports:
      - "5176:5174"   # Vite dev server
      - "8082:8080"   # Go backend (API, proxied by Vite)
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - node-modules:/app/frontend/node_modules
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - DATA_DIR=/app/data
      - DISABLE_BACKGROUND_TASKS=true
    working_dir: /app

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
