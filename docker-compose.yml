services:
  plextracker:
    build: .
    container_name: plextracker
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - DATA_DIR=/data
      - DISABLE_BACKGROUND_TASKS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
