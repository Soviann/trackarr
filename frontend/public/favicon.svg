<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="trackarrGrad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- 35% Dotted Arc (Finishes the circle clockwise on top-left) -->
  <circle cx="60" cy="60" r="48" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="3 8"/>
  
  <!-- 65% Solid Progress Ring: Starts at 12 o'clock (top, rotate -90) and advances clockwise to 8 o'clock -->
  <circle cx="60" cy="60" r="48" stroke="url(#trackarrGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="196 106" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>

  <!-- 'TR' Monogram (Font 1 Neo-Grotesk Vector Glyphs) -->
  <g fill="url(#trackarrGrad)">
    <!-- 'T' on left -->
    <path d="M 26 34 H 57 V 43 H 47 V 86 H 36 V 43 H 26 Z" />
    <!-- 'R' on right tightly tracked -->
    <path d="M 51 34 H 74 C 83 34 89 39.5 89 47.5 C 89 54.5 84 59 75.5 59.5 L 90 86 H 78.5 L 65.5 61 H 62 V 86 H 51 Z M 62 42.5 V 52.5 H 73.5 C 77.5 52.5 79 50.5 79 47.5 C 79 44.5 77.5 42.5 73.5 42.5 Z" />
  </g>
</svg>
