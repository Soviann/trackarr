name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  deploy:
    if: ${{ !failure() && !cancelled() }}
    needs: [ci, release]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to NAS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT }}
          command_timeout: 15m
          script: |
            export PATH="/usr/local/bin:$PATH"
            mkdir -p /volume1/docker/plextracker/antigravity
            if [ -f /volume1/docker/plextracker/.env.local ]; then
              cp -f /volume1/docker/plextracker/.env.local /volume1/docker/plextracker/antigravity/.env.local
            fi
            /volume1/docker/plextracker/scripts/nas-update.sh

      - name: Collect diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          port: ${{ secrets.NAS_SSH_PORT }}
          script: |
            export PATH="/usr/local/bin:$PATH"
            /volume1/docker/plextracker/scripts/nas-diagnostics.sh 2>&1
